[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-chess"
version = "0.1.0"
description = "A trainable chess agent with inspectable learning and search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["chess==1.11.2", "numpy>=2.1,<3", "torch>=2.9,<3", "filelock>=3,<5", "pygame-ce>=2.5.8,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
fly-chess = "fly_chess.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fly_chess.ui" = ["assets/*.ttf", "assets/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
